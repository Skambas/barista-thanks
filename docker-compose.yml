services:
  barista-thanks:
    # Образ збирає GitHub Actions (див. .github/workflows/ci.yml).
    # Заміни OWNER на свій логін GitHub малими літерами (і назву репозиторію, якщо вона інша).
    image: ${IMAGE:-ghcr.io/skambas/barista-thanks:latest}
    # Хочеш збирати образ прямо на сервері замість GHCR? Закоментуй image вище й розкоментуй:
    # build: .
    container_name: barista-thanks
    init: true
    restart: unless-stopped
    ports:
      # порт_на_сервері:порт_у_контейнері. Саме цей порт вписуєш у Nginx Proxy Manager
      - '${HOST_PORT:-3000}:3000'
    environment:
      SITE_URL: ${SITE_URL:-}
      MONOBANK_JAR_URL: ${MONOBANK_JAR_URL:-}
      BARISTA_SIGNATURE: ${BARISTA_SIGNATURE:-}
      CAFE_NAME: ${CAFE_NAME:-}
      CAFE_INSTAGRAM: ${CAFE_INSTAGRAM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
    volumes:
      - barista-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  barista-data:
